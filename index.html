<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HSL Kartta</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f0f1f2;
      height: -webkit-fill-available;
    }
    #map {
      width: 100%; height: 100%;
      height: -webkit-fill-available;
    }
    .maplibregl-ctrl-top-right {
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
    }
    .maplibregl-ctrl-bottom-right {
      bottom: max(12px, env(safe-area-inset-bottom));
      right: max(12px, env(safe-area-inset-right));
    }
    .maplibregl-ctrl-bottom-left {
      bottom: max(12px, env(safe-area-inset-bottom));
      left: max(12px, env(safe-area-inset-left));
    }
    .maplibregl-ctrl-attrib { display: none !important; }

    #center-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 48px;
      height: 48px;
      pointer-events: none;
      z-index: 10;
    }

    #info-card {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 16px 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      box-shadow: 0 -2px 16px rgba(0,0,0,0.12);
      z-index: 20;
    }

    #drag-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 0 auto 14px auto;
    }

    #address-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
      font-family: Arial, sans-serif;
    }

    #address-main {
      font-size: 17px;
      font-weight: bold;
      color: #0C0243;
      font-family: Arial, sans-serif;
      margin-bottom: 2px;
    }

    #address-city {
      font-size: 14px;
      color: #555;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <svg id="center-pointer" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#0C0243"/>
    <text x="12" y="11" text-anchor="middle" font-size="7" font-family="Arial" font-weight="bold" fill="white">P</text>
  </svg>

  <div id="info-card">
    <div id="drag-handle"></div>
    <div id="address-label">Valittu sijainti</div>
    <div id="address-main">Haetaan osoitetta...</div>
    <div id="address-city"></div>
  </div>

  <script>
    const API_KEY = 'a002614565b24559b3feddfca8d01918';

    function transformRequest(url, resourceType) {
      if (url.includes('digitransit.fi')) {
        return {
          url: url,
          headers: { 'digitransit-subscription-key': API_KEY }
        };
      }
      return { url };
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'omakartta_style.json',
      center: [24.9354, 60.1699],
      zoom: 12,
      minZoom: 5,
      maxZoom: 20,
      transformRequest: transformRequest,
      maxTileCacheSize: 50,
      fadeDuration: 100,
      dragRotate: false,
      touchPitch: false,
      pitchWithRotate: false,
      keyboard: false,
      attributionControl: false,
    });

    map.touchZoomRotate.disableRotation();

    map.on('load', () => {
      map.touchZoomRotate.disableRotation();
      map.dragRotate.disable();

      map.addSource('helsinki-parkit', {
        type: 'geojson',
        data: 'helsinki_parkit.geojson'
      });
      map.addLayer({
        id: 'helsinki-parkit-fill',
        type: 'fill',
        source: 'helsinki-parkit',
        minzoom: 13,
        paint: {
          'fill-color': '#4A90D9',
          'fill-opacity': 0.25
        }
      });
      map.addLayer({
        id: 'helsinki-parkit-outline',
        type: 'line',
        source: 'helsinki-parkit',
        minzoom: 13,
        paint: {
          'line-color': '#2B6CB0',
          'line-width': 1.5,
          'line-opacity': 0.9
        }
      });

      // Get address on first load
      reverseGeocode(map.getCenter());
    });

    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true,
    }), 'top-right');

    // Debounce timer
    let geocodeTimer = null;

    map.on('moveend', () => {
      clearTimeout(geocodeTimer);
      geocodeTimer = setTimeout(() => {
        reverseGeocode(map.getCenter());
      }, 400);
    });

    map.on('move', () => {
      document.getElementById('address-main').textContent = '...';
      document.getElementById('address-city').textContent = '';
    });

    function reverseGeocode(center) {
      const url = `https://api.digitransit.fi/geocoding/v1/reverse?point.lat=${center.lat}&point.lon=${center.lng}&size=1&lang=fi`;

      fetch(url, {
        headers: { 'digitransit-subscription-key': API_KEY }
      })
      .then(r => r.json())
      .then(data => {
        if (data.features && data.features.length > 0) {
          const props = data.features[0].properties;
          const street = props.name || 'Tuntematon osoite';
          const city = props.localadmin || props.locality || props.region || '';
          document.getElementById('address-main').textContent = street;
          document.getElementById('address-city').textContent = city;
        } else {
          document.getElementById('address-main').textContent = 'Osoitetta ei löydy';
          document.getElementById('address-city').textContent = '';
        }
      })
      .catch(() => {

        document
