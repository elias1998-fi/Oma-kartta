<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HSL Kartta</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f0f1f2;
      height: -webkit-fill-available;
    }
    #map {
      width: 100%; height: 100%;
      height: -webkit-fill-available;
    }
    .maplibregl-ctrl-attrib { display: none !important; }
    .maplibregl-ctrl { display: none !important; }

    #center-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 48px;
      height: 48px;
      pointer-events: none;
      z-index: 10;
    }

    .map-btn {
      position: fixed;
      z-index: 25;
      width: 39px;
      height: 39px;
      background: white;
      border: none;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-btn svg { width: 18px; height: 18px; }

    #menu-btn {
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
    }

    #filter-btn {
      top: max(64px, calc(env(safe-area-inset-top) + 48px));
      left: max(16px, env(safe-area-inset-left));
    }

    #filter-btn.active { background: #0C0243; }
    #filter-btn.active svg line { stroke: white; }
    #filter-btn.active svg circle { fill: white; stroke: none; }

    #plus-btn {
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
    }

    #location-btn {
      top: max(64px, calc(env(safe-area-inset-top) + 48px));
      right: max(16px, env(safe-area-inset-right));
    }

    #bottom-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80vh;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.15);
      z-index: 20;
      transform: translateY(calc(100% - 130px));
      touch-action: none;
      display: flex;
      flex-direction: column;
    }

    #drag-handle-area {
      width: 100%;
      padding: 14px 0 10px 0;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    #drag-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
    }

    #filter-close-btn {
      position: absolute;
      right: 16px;
      top: 10px;
      width: 28px;
      height: 28px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #555;
      z-index: 5;
    }

    #filter-close-btn.visible { display: flex; }

    #sheet-normal {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    #sheet-summary {
      padding: 0 20px 12px 20px;
      flex-shrink: 0;
      font-family: Arial, sans-serif;
    }

    #summary-header {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      margin-bottom: 3px;
    }

    #summary-type { font-size: 14px; color: #555; }

    #sheet-divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 0 20px;
      flex-shrink: 0;
    }

    #sheet-details {
      padding: 14px 20px 16px 20px;
      overflow-y: auto;
      flex: 1;
      font-family: Arial, sans-serif;
      background: white;
    }

    .hours-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 14px;
      color: #333;
    }

    .hours-day { color: #555; min-width: 60px; }
    .hours-time { font-weight: 500; }

    .price-label {
      font-size: 13px;
      color: #888;
      margin-top: 14px;
      margin-bottom: 4px;
    }

    .price-value { font-size: 14px; color: #333; }

    #sheet-filter {
      display: none;
      flex-direction: column;
      padding: 4px 24px 24px 24px;
      flex: 1;
      font-family: Arial, sans-serif;
    }

    #sheet-filter.visible { display: flex; }

    #filter-title {
      font-size: 16px;
      font-weight: bold;
      color: #222;
      margin-bottom: 6px;
    }

    #filter-subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }

    #slider-label {
      font-size: 15px;
      color: #222;
      margin-bottom: 16px;
      text-align: center;
    }

    #slider-value {
      font-weight: bold;
      color: #0C0243;
      font-size: 17px;
    }

    /* Dual range slider */
    .range-container {
      position: relative;
      height: 40px;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .range-track {
      position: absolute;
      width: 100%;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
    }

    .range-fill {
      position: absolute;
      height: 4px;
      background: #0C0243;
      border-radius: 2px;
    }

    .range-input {
      position: absolute;
      width: 100%;
      height: 4px;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
      pointer-events: none;
    }

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0C0243;
      cursor: pointer;
      pointer-events: all;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      border: 3px solid white;
    }

    .slider-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
    }

    #filter-result {
      margin-top: 16px;
      font-size: 13px;
      color: #555;
      text-align: center;
      min-height: 20px;
    }

    #btn-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: white;
      padding: 12px 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    #action-btn {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      color: white;
      background: #0C0243;
      opacity: 0.7;
      cursor: pointer;
      transition: opacity 0.2s ease;
      text-align: center;
    }

    #action-btn.active { opacity: 1; }
  </style>
</head>
<body>
  <div id="map"></div>

  <svg id="center-pointer" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#0C0243"/>
    <text x="12" y="11" text-anchor="middle" font-size="7" font-family="Arial" font-weight="bold" fill="white">P</text>
  </svg>

  <button class="map-btn" id="menu-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <button class="map-btn" id="filter-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round">
      <line x1="4" y1="6" x2="20" y2="6"/>
      <circle cx="8" cy="6" r="2" fill="#333" stroke="none"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <circle cx="16" cy="12" r="2" fill="#333" stroke="none"/>
      <line x1="4" y1="18" x2="20" y2="18"/>
      <circle cx="10" cy="18" r="2" fill="#333" stroke="none"/>
    </svg>
  </button>

  <button class="map-btn" id="plus-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <button class="map-btn" id="location-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <line x1="12" y1="2" x2="12" y2="6"/>
      <line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="6" y2="12"/>
      <line x1="18" y1="12" x2="22" y2="12"/>
    </svg>
  </button>

  <div id="bottom-sheet">
    <div id="drag-handle-area">
      <div id="drag-handle"></div>
      <button id="filter-close-btn">✕</button>
    </div>

    <div id="sheet-normal">
      <div id="sheet-summary">
        <div id="summary-header"></div>
        <div id="summary-type"></div>
      </div>
      <hr id="sheet-divider" />
      <div id="sheet-details"></div>
    </div>

    <div id="sheet-filter">
      <div id="filter-title">Suodata pysäköintialueet</div>
      <div id="filter-subtitle">Näytä vain alueet joilla sallittu pysäköintiaika on valitulla välillä:</div>

      <div id="slider-label">Aikaväli: <span id="slider-value">Kaikki</span></div>

      <div class="range-container">
        <div class="range-track"></div>
        <div class="range-fill" id="range-fill"></div>
        <input type="range" class="range-input" id="slider-min" min="0" max="25" step="1" value="0" />
        <input type="range" class="range-input" id="slider-max" min="0" max="25" step="1" value="25" />
      </div>

      <div class="slider-ticks">
        <span>0h</span>
        <span>6h</span>
        <span>12h</span>
        <span>18h</span>
        <span>24h+</span>
      </div>

      <div id="filter-result"></div>
    </div>
  </div>

  <div id="btn-container">
    <button id="action-btn">Valitse pysäköintialue</button>
  </div>

  <script>
    const API_KEY = 'a002614565b24559b3feddfca8d01918';

    function transformRequest(url, resourceType) {
      if (url.includes('digitransit.fi')) {
        return { url, headers: { 'digitransit-subscription-key': API_KEY } };
      }
      return { url };
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'omakartta_style.json',
      center: [24.9354, 60.1699],
      zoom: 12,
      minZoom: 5,
      maxZoom: 20,
      transformRequest,
      maxTileCacheSize: 50,
      fadeDuration: 100,
      dragRotate: false,
      touchPitch: false,
      pitchWithRotate: false,
      keyboard: false,
      attributionControl: false,
    });

    map.touchZoomRotate.disableRotation();

    function kestoToMinutes(kesto) {
      if (!kesto) return 9999;
      const lower = kesto.toLowerCase().trim();
      if (lower.includes('h')) {
        const h = parseFloat(lower);
        return isNaN(h) ? 9999 : h * 60;
      }
      if (lower.includes('min')) {
        const m = parseFloat(lower);
        return isNaN(m) ? 9999 : m;
      }
      return 9999;
    }

    map.on('load', () => {
      map.touchZoomRotate.disableRotation();
      map.dragRotate.disable();

      fetch('helsinki_parkit.geojson')
        .then(r => r.json())
        .then(data => {
          data.features = data.features.map(f => {
            f.properties.kesto_min = kestoToMinutes(f.properties['hel:kesto']);
            return f;
          });

          map.addSource('helsinki-parkit', { type: 'geojson', data });
          map.addLayer({
            id: 'helsinki-parkit-fill', type: 'fill', source: 'helsinki-parkit', minzoom: 13,
            paint: { 'fill-color': '#4A90D9', 'fill-opacity': 0.25 }
          });
          map.addLayer({
            id: 'helsinki-parkit-outline', type: 'line', source: 'helsinki-parkit', minzoom: 13,
            paint: { 'line-color': '#2B6CB0', 'line-width': 1.5, 'line-opacity': 0.9 }
          });
          map.addLayer({
            id: 'helsinki-parkit-highlight', type: 'line', source: 'helsinki-parkit', minzoom: 13,
            paint: { 'line-color': '#0C0243', 'line-width': 4, 'line-opacity': 1 },
            filter: ['==', ['get', 'hel:id'], -1]
          });

          checkParking();
        });
    });

    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true,
    });
    map.addControl(geolocate);

    document.getElementById('plus-btn').addEventListener('click', () => map.zoomIn());
    document.getElementById('location-btn').addEventListener('click', () => geolocate.trigger());

    // --- Dual range slider ---
    const sliderMin = document.getElementById('slider-min');
    const sliderMax = document.getElementById('slider-max');
    const rangeFill = document.getElementById('range-fill');
    const sliderValueEl = document.getElementById('slider-value');
    const filterResult = document.getElementById('filter-result');

    function formatHourLabel(val) {
      if (val === 0) return '0h';
      if (val >= 25) return '24h+';
      return `${val}h`;
    }

    function updateSliderUI() {
      const min = parseInt(sliderMin.value);
      const max = parseInt(sliderMax.value);
      const pctMin = (min / 25) * 100;
      const pctMax = (max / 25) * 100;
      rangeFill.style.left = pctMin + '%';
      rangeFill.style.width = (pctMax - pctMin) + '%';

      if (min === 0 && max >= 25) {
        sliderValueEl.textContent = 'Kaikki';
        filterResult.textContent = '';
      } else {
        sliderValueEl.textContent = `${formatHourLabel(min)} – ${formatHourLabel(max)}`;
        filterResult.textContent = `Näytetään ${formatHourLabel(min)} – ${formatHourLabel(max)} pysäköintialueet`;
      }
    }

    function applyRangeFilter() {
      if (!map.getSource('helsinki-parkit')) return;
      const min = parseInt(sliderMin.value);
      const max = parseInt(sliderMax.value);
      const minMinutes = min * 60;
      const maxMinutes = max >= 25 ? 99999 : max * 60;

      if (min === 0 && max >= 25) {
        map.setFilter('helsinki-parkit-fill', null);
        map.setFilter('helsinki-parkit-outline', null);
      } else {
        map.setFilter('helsinki-parkit-fill', [
          'all',
          ['>=', ['get', 'kesto_min'], minMinutes],
          ['<=', ['get', 'kesto_min'], maxMinutes]
        ]);
        map.setFilter('helsinki-parkit-outline', [
          'all',
          ['>=', ['get', 'kesto_min'], minMinutes],
          ['<=', ['get', 'kesto_min'], maxMinutes]
        ]);
      }
    }

    let sliderTouching = false;

    sliderMin.addEventListener('touchstart', () => { sliderTouching = true; }, { passive: true });
    sliderMax.addEventListener('touchstart', () => { sliderTouching = true; }, { passive: true });
    sliderMin.addEventListener('touchend', () => { sliderTouching = false; }, { passive: true });
    sliderMax.addEventListener('touchend', () => { sliderTouching = false; }, { passive: true });

    sliderMin.addEventListener('input', () => {
      if (parseInt(sliderMin.value) > parseInt(sliderMax.value)) {
        sliderMin.value = sliderMax.value;
      }
      updateSliderUI();
      applyRangeFilter();
    });

    sliderMax.addEventListener('input', () => {
      if (parseInt(sliderMax.value) < parseInt(sliderMin.value)) {
        sliderMax.value = sliderMin.value;
      }
      updateSliderUI();
      applyRangeFilter();
    });

    updateSliderUI();

    // --- Filter mode ---
    let filterMode = false;
    const sheet = document.getElementById('bottom-sheet');
    const filterBtn = document.getElementById('filter-btn');
    const filterCloseBtn = document.getElementById('filter-close-btn');
    const sheetNormal = document.getElementById('sheet-normal');
    const sheetFilter = document.getElementById('sheet-filter');

    function getCollapsedY() { return sheet.clientHeight - 130; }
    function getHalfY() { return window.innerHeight * 0.5; }

    function openFilter() {
      filterMode = true;
      filterBtn.classList.add('active');
      filterCloseBtn.classList.add('visible');
      sheetNormal.style.display = 'none';
      sheetFilter.classList.add('visible');
      sheet.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      sheet.style.transform = `translateY(${getHalfY()}px)`;
      currentY = getHalfY();
    }

    function closeFilter() {
      filterMode = false;
      filterBtn.classList.remove('active');
      filterCloseBtn.classList.remove('visible');
      sheetNormal.style.display = 'flex';
      sheetFilter.classList.remove('visible');
      sheet.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      sheet.style.transform = `translateY(${getCollapsedY()}px)`;
      currentY = getCollapsedY();
      // Reset sliders
      sliderMin.value = 0;
      sliderMax.value = 25;
      updateSliderUI();
      applyRangeFilter();
    }

    filterBtn.addEventListener('click', () => filterMode ? closeFilter() : openFilter());
    filterCloseBtn.addEventListener('click', closeFilter);

    let moveTimer = null;
    map.on('move', () => {
      highlightParking();
      clearTimeout(moveTimer);
      moveTimer = setTimeout(checkParking, 150);
    });
    map.on('zoomend', checkParking);

    const btn = document.getElementById('action-btn');
    const summaryHeader = document.getElementById('summary-header');
    const summaryType = document.getElementById('summary-type');
    const details = document.getElementById('sheet-details');
    const divider = document.getElementById('sheet-divider');
    let currentHighlightId = null;
    let currentY = getCollapsedY();

    function highlightParking() {
      if (!map.getLayer('helsinki-parkit-highlight')) return;
      const centerPixel = map.project(map.getCenter());
      const features = map.queryRenderedFeatures(centerPixel, { layers: ['helsinki-parkit-fill'] });
      if (features.length > 0) {
        const id = features[0].properties['hel:id'];
        if (id !== currentHighlightId) {
          currentHighlightId = id;
          map.setFilter('helsinki-parkit-highlight', ['==', ['get', 'hel:id'], id]);
        }
      } else {
        if (currentHighlightId !== null) {
          currentHighlightId = null;
          map.setFilter('helsinki-parkit-highlight', ['==', ['get', 'hel:id'], -1]);
        }
      }
    }

    function getOwnerName(raw) {
      if (!raw) return 'Tuntematon omistaja';
      if (raw.includes('KYMP') || raw.includes('HEL') || raw.includes('Helsinki')) return 'Helsingin kaupunki';
      return raw;
    }

    function getTypeName(raw) {
      if (!raw) return '-';
      const lower = raw.toLowerCase();
      if (lower.includes('kadunvarsi')) return 'Kadunvarsipysäköinti';
      if (lower.includes('halli')) return 'Pysäköintihalli';
      if (lower.includes('tori') || lower.includes('kenttä')) return 'Pysäköintikenttä';
      if (lower.includes('asukaspysäköinti')) return 'Asukaspysäköinti';
      return raw;
    }

    function getPriceText(luokka) {
      if (!luokka) return '-';
      const lower = luokka.toLowerCase();
      if (lower.includes('ilmainen')) return 'Ilmainen pysäköinti pysäköintikiekolla';
      if (lower.includes('maksullinen')) return 'Maksullinen pysäköinti';
      if (lower.includes('asukas')) return 'Asukaspysäköinti (tunnus vaaditaan)';
      return luokka;
    }

    function formatHours(voimassaolo) {
      if (!voimassaolo) {
        return `<div class="hours-row"><span class="hours-day">Ma – Su</span><span class="hours-time">24 h</span></div>`;
      }
      return `
        <div class="hours-row"><span class="hours-day">Ma – Pe</span><span class="hours-time">${voimassaolo}</span></div>
        <div class="hours-row"><span class="hours-day">La</span><span class="hours-time">${voimassaolo}</span></div>
        <div class="hours-row"><span class="hours-day">Su</span><span class="hours-time">–</span></div>
      `;
    }

    function checkParking() {
      if (filterMode) return;
      const zoom = map.getZoom();
      if (zoom < 13) {
        summaryHeader.textContent = '';
        summaryType.textContent = '';
        details.innerHTML = '';
        divider.style.display = 'none';
        btn.textContent = 'Zoomaa karttaa nähdäksesi pysäköintialueet';
        btn.classList.remove('active');
        return;
      }
      const centerPixel = map.project(map.getCenter());
      const features = map.queryRenderedFeatures(centerPixel, { layers: ['helsinki-parkit-fill'] });
      if (features.length > 0) {
        const p = features[0].properties;
        const owner = getOwnerName(p['hel:datanomistaja']);
        const kesto = p['hel:kesto'] || null;
        const voimassaolo = p['hel:voimassaolo'] || null;
        const luokka = p['hel:luokka_nimi'] || '';
        const tyyppi = getTypeName(p['hel:paikan_asento']);
        const hinta = getPriceText(luokka);
        const kestoText = kesto ? `Max. ${kesto}` : 'Rajoittamaton';
        summaryHeader.textContent = `${owner}  |  ${kestoText}`;
        summaryType.textContent = tyyppi;
        details.innerHTML = `
          ${formatHours(voimassaolo)}
          <p class="price-label">Hinta:</p>
          <p class="price-value">${hinta}</p>
        `;
        divider.style.display = 'block';
        btn.textContent = 'Pysäköi tähän';
        btn.classList.add('active');
      } else {
        summaryHeader.textContent = '';
        summaryType.textContent = '';
        details.innerHTML = '';
        divider.style.display = 'none';
        btn.textContent = 'Valitse pysäköintialue';
        btn.classList.remove('active');
      }
    }

    map.on('error', (e) => { console.warn('MapLibre virhe:', e.error?.message || e); });

    // Sheet drag — anywhere except sliders
    let startY = 0;
    let startTranslate = 0;
    let lastY = 0;
    let lastTime = 0;
    let velocity = 0;
    let isDragging = false;

    function snapTo(targetY) {
      sheet.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      sheet.style.transform = `translateY(${targetY}px)`;
      currentY = targetY;
    }

    sheet.addEventListener('touchstart', (e) => {
      if (sliderTouching || e.target === sliderMin || e.target === sliderMax) return;
      startY = e.touches[0].clientY;
      lastY = startY;
      lastTime = Date.now();
      velocity = 0;
      const matrix = new DOMMatrix(getComputedStyle(sheet).transform);
      startTranslate = matrix.m42;
      currentY = startTranslate;
      isDragging = true;
      sheet.style.transition = 'none';
    }, { passive: true });

    sheet.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const touch = e.touches[0].clientY;
      const now = Date.now();
      const dt = now - lastTime;
      if (dt > 0) velocity = (touch - lastY) / dt;
      lastY = touch;
      lastTime = now;
      const delta = touch - startY;
      currentY = Math.max(0, Math.min(getCollapsedY(), startTranslate + delta));
      sheet.style.transform = `translateY(${currentY}px)`;
    }, { passive: true });

    sheet.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      const collapsed = getCollapsedY();
      if (velocity > 0.5) {
        snapTo(collapsed);
      } else if (velocity < -0.5) {
        snapTo(0);
      } else {
        snapTo(currentY < collapsed / 2 ? 0 : collapsed);
      }
    });
  </script>
</body>
</html>
