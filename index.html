<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HSL Kartta</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f0f1f2;
      height: -webkit-fill-available;
    }
    #map {
      width: 100%; height: 100%;
      height: -webkit-fill-available;
    }
    .maplibregl-ctrl-top-right {
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
    }
    .maplibregl-ctrl-bottom-right {
      bottom: max(12px, env(safe-area-inset-bottom));
      right: max(12px, env(safe-area-inset-right));
    }
    .maplibregl-ctrl-bottom-left {
      bottom: max(12px, env(safe-area-inset-bottom));
      left: max(12px, env(safe-area-inset-left));
    }
    .maplibregl-ctrl-attrib { display: none !important; }

    #center-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 48px;
      height: 48px;
      pointer-events: none;
      z-index: 10;
    }

    #bottom-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 100vh;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.15);
      z-index: 20;
      touch-action: none;
    }

    #drag-handle-area {
      width: 100%;
      padding: 14px 0 10px 0;
      display: flex;
      justify-content: center;
    }

    #drag-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
    }

    .sheet-section {
      padding: 0 20px;
      font-family: Arial, sans-serif;
    }

    #section-summary {
      padding-bottom: 12px;
    }

    #summary-header {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      margin-bottom: 3px;
    }

    #summary-type {
      font-size: 14px;
      color: #555;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 0 20px;
    }

    #section-hours {
      padding-top: 12px;
      padding-bottom: 12px;
    }

    #section-price {
      padding-top: 4px;
      padding-bottom: 12px;
    }

    .hours-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 14px;
      color: #333;
    }

    .hours-day { color: #555; min-width: 60px; }
    .hours-time { font-weight: 500; }

    .price-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
    }

    .price-value {
      font-size: 14px;
      color: #333;
    }

    #btn-container {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 30;
      background: white;
      padding: 12px 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    #action-btn {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      color: white;
      background: #0C0243;
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.2s ease;
      text-align: center;
    }

    #action-btn.active { opacity: 1; }
  </style>
</head>
<body>
  <div id="map"></div>

  <svg id="center-pointer" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#0C0243"/>
    <text x="12" y="11" text-anchor="middle" font-size="7" font-family="Arial" font-weight="bold" fill="white">P</text>
  </svg>

  <div id="bottom-sheet">
    <div id="drag-handle-area">
      <div id="drag-handle"></div>
    </div>

    <!-- Level 1: always visible when parking selected -->
    <div class="sheet-section" id="section-summary">
      <div id="summary-header"></div>
      <div id="summary-type"></div>
    </div>

    <hr class="divider" id="divider-hours" style="display:none" />

    <!-- Level 2: visible at mid and full -->
    <div class="sheet-section" id="section-hours" style="display:none">
      <div id="hours-content"></div>
    </div>

    <hr class="divider" id="divider-price" style="display:none" />

    <!-- Level 3: visible only when fully expanded -->
    <div class="sheet-section" id="section-price" style="display:none">
      <p class="price-label">Hinta:</p>
      <p id="price-value" class="price-value"></p>
    </div>
  </div>

  <div id="btn-container">
    <button id="action-btn">Valitse pysäköintialue</button>
  </div>

  <script>
    const API_KEY = 'a002614565b24559b3feddfca8d01918';

    function transformRequest(url) {
      if (url.includes('digitransit.fi')) {
        return { url, headers: { 'digitransit-subscription-key': API_KEY } };
      }
      return { url };
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'omakartta_style.json',
      center: [24.9354, 60.1699],
      zoom: 12,
      minZoom: 5,
      maxZoom: 20,
      transformRequest,
      maxTileCacheSize: 50,
      fadeDuration: 100,
      dragRotate: false,
      touchPitch: false,
      pitchWithRotate: false,
      keyboard: false,
      attributionControl: false,
    });

    map.touchZoomRotate.disableRotation();

    map.on('load', () => {
      map.touchZoomRotate.disableRotation();
      map.dragRotate.disable();

      map.addSource('helsinki-parkit', { type: 'geojson', data: 'helsinki_parkit.geojson' });
      map.addLayer({
        id: 'helsinki-parkit-fill', type: 'fill', source: 'helsinki-parkit', minzoom: 13,
        paint: { 'fill-color': '#4A90D9', 'fill-opacity': 0.25 }
      });
      map.addLayer({
        id: 'helsinki-parkit-outline', type: 'line', source: 'helsinki-parkit', minzoom: 13,
        paint: { 'line-color': '#2B6CB0', 'line-width': 1.5, 'line-opacity': 0.9 }
      });

      checkParking();
    });

    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true,
    }), 'top-right');

    map.on('moveend', checkParking);
    map.on('zoomend', checkParking);

    const btn = document.getElementById('action-btn');
    const sheet = document.getElementById('bottom-sheet');
    const btnContainer = document.getElementById('btn-container');

    function getOwnerName(raw) {
      if (!raw) return 'Tuntematon omistaja';
      if (raw.includes('KYMP') || raw.includes('HEL') || raw.includes('Helsinki')) return 'Helsingin kaupunki';
      return raw;
    }

    function getTypeName(raw) {
      if (!raw) return '-';
      const lower = raw.toLowerCase();
      if (lower.includes('kadunvarsi')) return 'Kadunvarsipysäköinti';
      if (lower.includes('halli')) return 'Pysäköintihalli';
      if (lower.includes('tori') || lower.includes('kenttä')) return 'Pysäköintikenttä';
      if (lower.includes('asukaspysäköinti')) return 'Asukaspysäköinti';
      return raw;
    }

    function getPriceText(luokka) {
      if (!luokka) return '-';
      const lower = luokka.toLowerCase();
      if (lower.includes('ilmainen')) return 'Ilmainen pysäköinti pysäköintikiekolla';
      if (lower.includes('maksullinen')) return 'Maksullinen pysäköinti';
      if (lower.includes('asukas')) return 'Asukaspysäköinti (tunnus vaaditaan)';
      return luokka;
    }

    let parkingFound = false;

    function checkParking() {
      const zoom = map.getZoom();

      if (zoom < 13) {
        clearSheet();
        btn.textContent = 'Zoomaa karttaa nähdäksesi pysäköintialueet';
        btn.classList.remove('active');
        parkingFound = false;
        snapTo(SNAP_1);
        return;
      }

      const centerPixel = map.project(map.getCenter());
      const features = map.queryRenderedFeatures(centerPixel, { layers: ['helsinki-parkit-fill'] });

      if (features.length > 0) {
        const p = features[0].properties;
        const owner = getOwnerName(p['hel:datanomistaja']);
        const kesto = p['hel:kesto'] || null;
        const voimassaolo = p['hel:voimassaolo'] || null;
        const luokka = p['hel:luokka_nimi'] || '';
        const tyyppi = getTypeName(p['hel:paikan_asento']);
        const hinta = getPriceText(luokka);
        const kestoText = kesto ? `Max. ${kesto}` : 'Rajoittamaton';

        document.getElementById('summary-header').textContent = `${owner} | ${kestoText}`;
        document.getElementById('summary-type').textContent = tyyppi;

        const hoursHtml = voimassaolo ? `
          <div class="hours-row"><span class="hours-day">Ma – Pe</span><span class="hours-time">${voimassaolo}</span></div>
          <div class="hours-row"><span class="hours-day">La</span><span class="hours-time">${voimassaolo}</span></div>
          <div class="hours-row"><span class="hours-day">Su</span><span class="hours-time">–</span></div>
        ` : `<div class="hours-row"><span class="hours-day">Ma – Su</span><span class="hours-time">24 h</span></div>`;

        document.getElementById('hours-content').innerHTML = hoursHtml;
        document.getElementById('price-value').textContent = hinta;

        document.getElementById('divider-hours').style.display = 'block';
        document.getElementById('section-hours').style.display = 'block';
        document.getElementById('divider-price').style.display = 'block';
        document.getElementById('section-price').style.display = 'block';

        btn.textContent = 'Pysäköi tähän';
        btn.classList.add('active');

        if (!parkingFound) {
          snapTo(SNAP_1);
        }
        parkingFound = true;

      } else {
        clearSheet();
        btn.textContent = 'Valitse pysäköintialue';
        btn.classList.remove('active');
        parkingFound = false;
        snapTo(SNAP_1);
      }
    }

    function clearSheet() {
      document.getElementById('summary-header').textContent = '';
      document.getElementById('summary-type').textContent = '';
      document.getElementById('hours-content').innerHTML = '';
      document.getElementById('price-value').textContent = '';
      document.getElementById('divider-hours').style.display = 'none';
      document.getElementById('section-hours').style.display = 'none';
      document.getElementById('divider-price').style.display = 'none';
      document.getElementById('section-price').style.display = 'none';
    }

    map.on('error', (e) => { console.warn('MapLibre virhe:', e.error?.message || e); });

    // --- Three-position snap sheet ---
    // Snap positions: translateY from top of screen
    // Sheet height = 100vh, so translateY = windowH - visible_height

    const HANDLE_H = 38;   // drag handle area
    const SUMMARY_H = 58;  // header + type text
    const HOURS_H = 90;    // 3 hours rows + divider
    const PRICE_H = 60;    // price label + value + divider

    function getSnaps() {
      const h = window.innerHeight;
      const SNAP_1_visible = HANDLE_H + SUMMARY_H;               // level 1
      const SNAP_2_visible = SNAP_1_visible + HOURS_H;           // level 2
      const SNAP_3_visible = SNAP_2_visible + PRICE_H;           // level 3
      return [
        h - SNAP_1_visible,
        h - SNAP_2_visible,
        h - SNAP_3_visible,
      ];
    }

    const [SNAP_1, SNAP_2, SNAP_3] = getSnaps();
    let currentTranslate = getSnaps()[0];

    function snapTo(target) {
      sheet.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      sheet.style.transform = `translateY(${target}px)`;
      currentTranslate = target;
    }

    // Start collapsed
    sheet.style.transform = `translateY(${SNAP_1}px)`;

    let startY = 0;
    let startTranslate = 0;
    let lastY = 0;
    let lastTime = 0;
    let velocity = 0;
    let isDragging = false;

    sheet.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      lastY = startY;
      lastTime = Date.now();
      velocity = 0;
      const matrix = new DOMMatrix(getComputedStyle(sheet).transform);
      startTranslate = matrix.m42;
      currentTranslate = startTranslate;
      isDragging = true;
      sheet.style.transition = 'none';
    }, { passive: true });

    sheet.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const touch = e.touches[0].clientY;
      const now = Date.now();
      const dt = now - lastTime;
      if (dt > 0) velocity = (touch - lastY) / dt;
      lastY = touch;
      lastTime = now;

      const snaps = getSnaps();
      const min = snaps[snaps.length - 1];
      const max = snaps[0];
      const delta = touch - startY;
      currentTranslate = Math.max(min, Math.min(max, startTranslate + delta));
      sheet.style.transform = `translateY(${currentTranslate}px)`;
    }, { passive: true });

    sheet.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;

      const snaps = getSnaps();

      let target;
      if (velocity > 0.4) {
        // Flick down — move to next lower snap (higher translateY number)
        const lower = snaps.filter(s => s > currentTranslate);
        target = lower.length > 0 ? Math.min(...lower) : snaps[0];
      } else if (velocity < -0.4) {
        // Flick up — move to next higher snap (lower translateY number)
        const higher = snaps.filter(s => s < currentTranslate);
        target = higher.length > 0 ? Math.max(...higher) : snaps[snaps.length - 1];
      } else {
        // No flick — snap to nearest
        target = snaps.reduce((prev, curr) =>
          Math.abs(curr - currentTranslate) < Math.abs(prev - currentTranslate) ? curr : prev
        );
      }

      snapTo(target);
    });
  </script>
</body>
</html>
