<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Oma HSL Kartta</title>
    
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Sinun API-avaimesi
    const key = 'a002614565b24559b3feddfca8d01918';

    const map = new maplibregl.Map({
        container: 'map',
        style: './style.json', // Tämä etsii tiedoston samasta kansiosta
        center: [24.941, 60.172], // Helsinki
        zoom: 13,
        transformRequest: (url, resourceType) => {
            if (url.includes('api.digitransit.fi')) {
                return {
                    url: url,
                    headers: { 'digitransit-subscription-key': key }
                };
            }
        }
    });

    // Lisätään sijaintinappi
    map.addControl(new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true
    }));
</script>

</body>
</html>
