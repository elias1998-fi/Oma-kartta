<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HSL Kartta</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f0f1f2;
      height: -webkit-fill-available;
    }
    #map {
      width: 100%; height: 100%;
      height: -webkit-fill-available;
    }
    .maplibregl-ctrl-top-right {
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
    }
    .maplibregl-ctrl-bottom-right {
      bottom: max(12px, env(safe-area-inset-bottom));
      right: max(12px, env(safe-area-inset-right));
    }
    .maplibregl-ctrl-bottom-left {
      bottom: max(12px, env(safe-area-inset-bottom));
      left: max(12px, env(safe-area-inset-left));
    }
    .maplibregl-ctrl-attrib { display: none !important; }

    #center-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 48px;
      height: 48px;
      pointer-events: none;
      z-index: 10;
    }

    #bottom-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80vh;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.15);
      z-index: 20;
      transform: translateY(calc(100% - 80px));
      transition: transform 0.3s ease;
      touch-action: none;
    }

    #drag-handle-area {
      width: 100%;
      padding: 14px 0 10px 0;
      display: flex;
      justify-content: center;
    }

    #drag-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
    }

    #sheet-content {
      padding: 4px 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      overflow-y: auto;
      max-height: calc(80vh - 60px);
      font-family: Arial, sans-serif;
    }

    #no-parking {
      color: #aaa;
      font-size: 15px;
      text-align: center;
      margin-top: 10px;
    }

    .card-header {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      margin-bottom: 4px;
    }

    .card-type {
      font-size: 14px;
      color: #555;
      margin-bottom: 16px;
    }

    .section-divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 12px 0;
    }

    .hours-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 14px;
      color: #333;
    }

    .hours-day {
      color: #555;
      min-width: 60px;
    }

    .hours-time {
      font-weight: 500;
    }

    .price-label {
      font-size: 13px;
      color: #888;
      margin-top: 14px;
      margin-bottom: 4px;
    }

    .price-value {
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <svg id="center-pointer" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#0C0243"/>
    <text x="12" y="11" text-anchor="middle" font-size="7" font-family="Arial" font-weight="bold" fill="white">P</text>
  </svg>

  <div id="bottom-sheet">
    <div id="drag-handle-area">
      <div id="drag-handle"></div>
    </div>
    <div id="sheet-content">
      <div id="no-parking">Siirrä karttaa pysäköintialueelle</div>
    </div>
  </div>

  <script>
    const API_KEY = 'a002614565b24559b3feddfca8d01918';

    function transformRequest(url, resourceType) {
      if (url.includes('digitransit.fi')) {
        return {
          url: url,
          headers: { 'digitransit-subscription-key': API_KEY }
        };
      }
      return { url };
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'omakartta_style.json',
      center: [24.9354, 60.1699],
      zoom: 12,
      minZoom: 5,
      maxZoom: 20,
      transformRequest: transformRequest,
      maxTileCacheSize: 50,
      fadeDuration: 100,
      dragRotate: false,
      touchPitch: false,
      pitchWithRotate: false,
      keyboard: false,
      attributionControl: false,
    });

    map.touchZoomRotate.disableRotation();

    map.on('load', () => {
      map.touchZoomRotate.disableRotation();
      map.dragRotate.disable();

      map.addSource('helsinki-parkit', {
        type: 'geojson',
        data: 'helsinki_parkit.geojson'
      });
      map.addLayer({
        id: 'helsinki-parkit-fill',
        type: 'fill',
        source: 'helsinki-parkit',
        minzoom: 13,
        paint: {
          'fill-color': '#4A90D9',
          'fill-opacity': 0.25
        }
      });
      map.addLayer({
        id: 'helsinki-parkit-outline',
        type: 'line',
        source: 'helsinki-parkit',
        minzoom: 13,
        paint: {
          'line-color': '#2B6CB0',
          'line-width': 1.5,
          'line-opacity': 0.9
        }
      });
    });

    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true,
    }), 'top-right');

    map.on('moveend', checkParking);
    map.on('zoomend', checkParking);

    function getOwnerName(raw) {
      if (!raw) return 'Tuntematon omistaja';
      if (raw.includes('KYMP') || raw.includes('HEL') || raw.includes('Helsinki')) return 'Helsingin kaupunki';
      return raw;
    }

    function getTypeName(raw) {
      if (!raw) return '-';
      const lower = raw.toLowerCase();
      if (lower.includes('kadunvarsi')) return 'Kadunvarsipysäköinti';
      if (lower.includes('halli')) return 'Pysäköintihalli';
      if (lower.includes('tori') || lower.includes('kenttä')) return 'Pysäköintikenttä';
      if (lower.includes('asukas')) return 'Asukaspysäköinti';
      return raw;
    }

    function getPriceText(luokka) {
      if (!luokka) return '-';
      const lower = luokka.toLowerCase();
      if (lower.includes('ilmainen')) return 'Ilmainen pysäköinti pysäköintikiekolla';
      if (lower.includes('maksullinen')) return 'Maksullinen pysäköinti';
      if (lower.includes('asukas')) return 'Asukaspysäköinti (tunnus vaaditaan)';
      return luokka;
