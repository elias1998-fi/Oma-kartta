<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HSL Kartta</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f0f1f2;
      height: -webkit-fill-available;
    }
    #map {
      width: 100%; height: 100%;
      height: -webkit-fill-available;
    }
    .maplibregl-ctrl-top-right {
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
    }
    .maplibregl-ctrl-bottom-right {
      bottom: max(12px, env(safe-area-inset-bottom));
      right: max(12px, env(safe-area-inset-right));
    }
    .maplibregl-ctrl-bottom-left {
      bottom: max(12px, env(safe-area-inset-bottom));
      left: max(12px, env(safe-area-inset-left));
    }
    .maplibregl-ctrl-attrib { display: none !important; }

    #center-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 48px;
      height: 48px;
      pointer-events: none;
      z-index: 10;
    }

    /* Bottom sheet */
    #bottom-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80vh;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.15);
      z-index: 20;
      transform: translateY(calc(100% - 80px));
      transition: transform 0.3s ease;
      touch-action: none;
    }

    #bottom-sheet.expanded {
      transform: translateY(0);
    }

    #drag-handle-area {
      width: 100%;
      padding: 14px 0 10px 0;
      display: flex;
      justify-content: center;
      cursor: grab;
    }

    #drag-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
    }

    #sheet-content {
      padding: 10px 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <svg id="center-pointer" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#0C0243"/>
    <text x="12" y="11" text-anchor="middle" font-size="7" font-family="Arial" font-weight="bold" fill="white">P</text>
  </svg>

  <div id="bottom-sheet">
    <div id="drag-handle-area">
      <div id="drag-handle"></div>
    </div>
    <div id="sheet-content">
      <!-- Content goes here later -->
    </div>
  </div>

  <script>
    const API_KEY = 'a002614565b24559b3feddfca8d01918';

    function transformRequest(url, resourceType) {
      if (url.includes('digitransit.fi')) {
        return {
          url: url,
          headers: { 'digitransit-subscription-key': API_KEY }
        };
      }
      return { url };
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'omakartta_style.json',
      center: [24.9354, 60.1699],
      zoom: 12,
      minZoom: 5,
      maxZoom: 20,
      transformRequest: transformRequest,
      maxTileCacheSize: 50,
      fadeDuration: 100,
      dragRotate: false,
      touchPitch: false,
      pitchWithRotate: false,
      keyboard: false,
      attributionControl: false,
    });

    map.touchZoomRotate.disableRotation();

    map.on('load', () => {
      map.touchZoomRotate.disableRotation();
      map.dragRotate.disable();

      map.addSource('helsinki-parkit', {
        type: 'geojson',
        data: 'helsinki_parkit.geojson'
      });
      map.addLayer({
        id: 'helsinki-parkit-fill',
        type: 'fill',
        source: 'helsinki-parkit',
        minzoom: 13,
        paint: {
          'fill-color': '#4A90D9',
          'fill-opacity': 0.25
        }
      });
      map.addLayer({
        id: 'helsinki-parkit-outline',
        type: 'line',
        source: 'helsinki-parkit',
        minzoom: 13,
        paint: {
          'line-color': '#2B6CB0',
          'line-width': 1.5,
          'line-opacity': 0.9
        }
      });
    });

    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true,
    }), 'top-right');

    map.on('error', (e) => { console.warn('MapLibre virhe:', e.error?.message || e); });

    // Bottom sheet drag logic
    const sheet = document.getElementById('bottom-sheet');
    const handle = document.getElementById('drag-handle-area');
    let startY = 0;
    let startTranslate = 0;
    const collapsedY = sheet.clientHeight - 80;

    handle.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      const transform = new DOMMatrix(getComputedStyle(sheet).transform);
      startTranslate = transform.m42;
      sheet.style.transition = 'none';
    }, { passive: true });

    handle.addEventListener('touchmove', (e) => {
      const delta = e.touches[0].clientY - startY;
      const newY = Math.max(0, Math.min(collapsedY, startTranslate + delta));
      sheet.style.transform = `translateY(${newY}px)`;
    }, { passive: true });

    handle.addEventListener('touchend', (e) => {
      sheet.style.transition = 'transform 0.3s ease';
      const transform = new DOMMatrix(getComputedStyle(sheet).transform);
      const currentY = transform.m42;
      if (currentY < collapsedY / 2) {
        sheet.style.transform = 'translateY(0)';
      } else {
        sheet.style.transform = `translateY(${collapsedY}px)`;
      }
    });
  </script>
</body>
</html>
